name: Docker Image CI + App Runner CD

on:
  push:
    branches: [ "deploy-backend" ]
  pull_request:
    branches: [ "deploy-backend" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write # for oicd
      contents: read  # for checkout

    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{secrets.AWS_ROLE_ARN}}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Define image tags
      id: define-tags
      run: |
        echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
        echo "ECR_REPOSITORY=aptech/synos-backend" >> $GITHUB_ENV
        echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "IMAGE_LATEST=latest" >> $GITHUB_ENV

    - name: Build and Tag image
      run: |
        docker build -f ./backend/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST ./backend/Synos.Api
    
    - name: Test container 
      run: |
        docker run -d --name synos-backend -p 8080:8080 -e "FrontendUrl=*" $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

        echo "Waiting for container to be healthy..."
        timeout=30
        while [ $timeout -gt 0 ]; do
          if curl -sf http://localhost:8080/api/health | grep -Fxq "Healthy"; then
            echo "Health check passed!"
            docker logs synos-backend # debug logs
            exit 0 # Thành công
          fi
          sleep 2
          timeout=$((timeout - 2))
        done
        
        echo "Health check failed after 30 seconds."
        docker logs synos-backend
        exit 1 

    - name: Push the Image to Amazon ECR
      if: github.event_name == 'push' # Chỉ chạy khi push, không chạy khi PR
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST

  deploy-to-app-runner:
    runs-on: ubuntu-latest
    needs: build-and-push 
    if: github.event_name == 'push' # Chỉ deploy khi push

    steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{secrets.AWS_ROLE_ARN}}
        aws-region: ap-southeast-1

    - name: Deploy to App Runner
      run: |
        aws apprunner start-deployment --service-arn ${{secrets.AWS_ROLE_ARN}}