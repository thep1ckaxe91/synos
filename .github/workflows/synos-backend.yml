name: Docker Image CI + App Runner CD

on:
  push:
    branches: [ "deploy-backend" ]
  pull_request:
    branches: [ "deploy-backend" ]

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.SYNOS_IMAGE_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SYNOS_IMAGE_AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Build, Tag, and 
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: aptech/synos-backend
        IMAGE_TAG: latest
      run: |
        docker build -f ./backend/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend/Synos.Api
    
    # - name: Test container # TODO: run test the container first, use /api/health to check
    #   env:
    #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    #     ECR_REPOSITORY: aptech/synos-backend
    #     IMAGE_TAG: latest
    #   run: |
    #     docker run 

    - name: Push the Image to Amazon ECR
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG