name: Docker Image CI

on:
  push:
    branches: [ "deploy-backend" ]
  pull_request:
    branches: [ "deploy-backend" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build ./backend/Synos.Api --file ../Dockerfile -t aptech/synos-backend
