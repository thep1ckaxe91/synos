name: Docker Image CI Frontend

permissions:
  id-token: write # for oicd
  contents: read  # for checkout
on:
  push:
    branches: [ "deploy-frontend" ]
  pull_request:
    branches: [ "deploy-frontend" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    

    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{secrets.AWS_ROLE_ARN}}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Define image tags
      id: define-tags
      run: |
        echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
        echo "ECR_REPOSITORY=aptech/synos-frontend" >> $GITHUB_ENV
        echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "IMAGE_LATEST=latest" >> $GITHUB_ENV

    - name: Build and Tag image
      run: |
        docker build -f ./frontend/Dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST ./frontend/
# TODO: add unit test run here
    - name: Push the Image to Amazon ECR
      if: github.event_name == 'push'
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST