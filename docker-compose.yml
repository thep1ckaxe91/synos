services:
  mariadb:
    image: mysql:8.0.42
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./backend/Synos.Api
      dockerfile: ../Dockerfile
    ports:
      - "8080:8080" # ASP.NET application listens on port 8080 inside the container
    depends_on:
      - mariadb
    env_file:
      - .env
    # command: [ "dotnet", "run" ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Next.js default port
    depends_on:
     - backend

volumes:
  mariadb_data:
