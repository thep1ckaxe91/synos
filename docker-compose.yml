services:
  mysql:
    image: mysql:8.0
    container_name: synos_mysql
    environment:
      MYSQL_ROOT_PASSWORD: synos_root_password
      MYSQL_DATABASE: synos_db
      MYSQL_USER: synos_user
      MYSQL_PASSWORD: synos_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synos_backend
    ports:
      - "8080:8080" # ASP.NET application listens on port 8080 inside the container
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=synos_db;User Id=synos_user;Password=synos_password;Port=3306;
  frontend-admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: synos_frontend_admin
    ports:
      - "3000:3000" # Next.js admin app
    depends_on:
      - backend

  frontend-gallery:
    build:
      context: ./frontend/gallery
      dockerfile: Dockerfile
    container_name: synos_frontend_gallery
    ports:
      - "3001:3000" # Gallery app mapped to host 3001
    depends_on:
      - backend

volumes:
  mysql_data:
