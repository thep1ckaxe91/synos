services:
  mariadb:
    image: mariadb:10.6
    environment:
      MARIADB_ROOT_PASSWORD: your_mariadb_root_password
      MARIADB_DATABASE: synos_db
      MARIADB_USER: synos_user
      MARIADB_PASSWORD: synos_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: ./backend/Synos.Api
      dockerfile: ../Dockerfile
    ports:
      - "8080:8080" # ASP.NET application listens on port 8080 inside the container
    depends_on:
      - mariadb
    env_file:
      - .env
    # command: [ "dotnet", "run" ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Next.js default port
    depends_on:
     - backend

volumes:
  mariadb_data:
